name: Actualizar Informe de Bajas

on:
  schedule:
    # Se ejecuta automáticamente todos los viernes a las 09:00 UTC (10:00/11:00 AM hora de España)
    - cron: '0 9 * * 5'
  workflow_dispatch: # Permite ejecutar el informe manualmente cuando tú quieras

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerías necesarias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas lxml tabulate openpyxl

    - name: Ejecutar script extractor
      run: python actualizar_bajas.py

    - name: Guardar cambios en el repositorio
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add README.md informes/*
        git commit -m "Actualización automática de bajas: $(date +'%Y-%m-%d')" || exit 0
        git push
